<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>WebChat - User Profile</title>
	<link rel="stylesheet" href="profile.css">
</head>
<body>
	<header>
		<h1>User Profile</h1>
	</header>

	<main>
		<div id="message" class="message hidden"></div>

		<!-- Profile Form Section -->
		<section id="profile-section" hidden>
			<h2>Personal Information</h2>
			<p class="help">This information is used by the agent to fill out forms on your behalf.</p>

			<form id="profile-form" class="profile-form">
				<div class="form-grid">
					<div class="form-row">
						<label for="first_name">First Name</label>
						<input type="text" id="first_name" name="first_name">
					</div>
					<div class="form-row">
						<label for="last_name">Last Name</label>
						<input type="text" id="last_name" name="last_name">
					</div>
				</div>

				<div class="form-row">
					<label for="email">Email</label>
					<input type="email" id="email" name="email">
				</div>

				<div class="form-row">
					<label for="phone">Phone Number</label>
					<input type="tel" id="phone" name="phone" placeholder="e.g., 555-123-4567">
				</div>

				<div class="form-row">
					<label for="street">Street Address</label>
					<input type="text" id="street" name="street">
				</div>

				<div class="form-grid">
					<div class="form-row">
						<label for="city">City</label>
						<input type="text" id="city" name="city">
					</div>
					<div class="form-row">
						<label for="state">State</label>
						<input type="text" id="state" name="state">
					</div>
				</div>

				<div class="form-grid">
					<div class="form-row">
						<label for="zip">ZIP Code</label>
						<input type="text" id="zip" name="zip">
					</div>
					<div class="form-row">
						<label for="country">Country</label>
						<input type="text" id="country" name="country" value="United States">
					</div>
				</div>

				<div class="form-row">
					<label for="birth_date">Date of Birth</label>
					<input type="date" id="birth_date" name="birth_date">
				</div>

				<!-- Dynamic fields added by agent will appear here -->
				<div id="dynamic-fields"></div>

				<div class="btn-row">
					<button type="submit" class="btn-primary">Save Profile</button>
				</div>
			</form>
		</section>

		<!-- Site-Specific Data Section -->
		<section id="site-data-section" hidden>
			<h2>Saved Site Data</h2>
			<p class="help">Data saved from agent sessions, organized by website.</p>
			<div id="site-data-container">
				<p class="empty-state">No site data saved yet.</p>
			</div>
		</section>

		<!-- Danger Zone Section -->
		<section id="danger-section" hidden>
			<h2 class="danger-heading">Danger Zone</h2>
			<p class="help">Permanently delete your profile data. This cannot be undone.</p>
			<button type="button" id="delete-profile-btn" class="btn-danger">Delete Profile</button>
		</section>
	</main>

	<script type="module" src="profile.js"></script>
</body>
</html>
