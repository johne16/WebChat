<!-- extension/panel.html -->
<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
<header class="hdr"><strong>WebChat</strong>
	<span id="service-status" class="service-status" title="Checking services..."></span>
	<span id="header-progress" class="header-progress" hidden></span>
	<div class="hdr-buttons">
		<button id="stop-agent-btn" type="button" aria-label="Stop agent" title="Stop agent" class="icon-btn stop-btn" hidden>
			<svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
				<rect x="6" y="6" width="12" height="12" rx="2"/>
			</svg>
		</button>
		<button id="close" type="button" aria-label="Close" title="Close">X</button>
	</div>
</header>
<div id="sticky-banner" class="sticky-banner">
	<span id="banner-message"></span>
	<button id="banner-continue" type="button">Continue</button>
</div>
<main id="log" class="log" aria-live="polite"></main>
<footer class="ftr">
	<form id="form" class="bar">
		<input id="prompt" class="inp" placeholder="Type a message…" autocomplete="off">
		<button class="btn" type="submit">Send</button>
		<button id="open-options" type="button" aria-label="Open settings" title="Settings" class="icon-btn">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"
				 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
				 aria-hidden="true">
				<circle cx="12" cy="12" r="3"></circle>
				<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82a2 2 0 1 1-2.83 2.83a1.65 1.65 0 0 0-1.82-.33
             1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51
             1.65 1.65 0 0 0-1.82.33A2 2 0 1 1 4.27 16.8a1.65 1.65 0 0 0 .33-1.82
             1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1
             1.65 1.65 0 0 0-.33-1.82A2 2 0 1 1 7.1 3.55a1.65 1.65 0 0 0 1.82.33
             1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51
             1.65 1.65 0 0 0 1.82-.33A2 2 0 1 1 20.45 7.1a1.65 1.65 0 0 0-.33 1.82
             1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
			</svg>
		</button>
	</form>
</footer>
<script type="module" src="panel.js"></script>
