<!-- extension/panel.html -->
<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
<header class="hdr"><strong>Web.Chat</strong>
	<div class="hdr-buttons">
		<button id="research-mode-btn" type="button" aria-label="Deep search" title="Deep search" class="icon-btn">
			<svg width="20" height="20" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="currentColor" stroke-width="6"/>
				<circle cx="35" cy="50" r="9" fill="none" stroke="currentColor" stroke-width="6"/>
				<circle cx="60" cy="32" r="7" fill="none" stroke="currentColor" stroke-width="6"/>
				<circle cx="60" cy="68" r="5" fill="none" stroke="currentColor" stroke-width="6"/>
				<line x1="41" y1="45" x2="54" y2="35" stroke="currentColor" stroke-width="6"/>
				<line x1="41" y1="55" x2="55" y2="66" stroke="currentColor" stroke-width="6"/>
			</svg>
		</button>
		<button id="close" type="button" aria-label="Close" title="Close">X</button>
	</div>
</header>
<main id="log" class="log" aria-live="polite"></main>
<footer class="ftr">
	<form id="form" class="bar">
		<input id="prompt" class="inp" placeholder="Type a message…" autocomplete="off">
		<button class="btn" type="submit">Send</button>
		<button id="open-options" type="button" aria-label="Open settings" title="Settings" class="icon-btn">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"
				 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
				 aria-hidden="true">
				<circle cx="12" cy="12" r="3"></circle>

             1.65 1.65 0 0 0-1.82.33A2 2 0 1 1 4.27 16.8a1.65 1.65 0 0 0 .33-1.82
             1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1
             1.65 1.65 0 0 0-.33-1.82A2 2 0 1 1 7.1 3.55a1.65 1.65 0 0 0 1.82.33

		</button>
	</form>
</footer>
<script type="module" src="panel.js"></script>
