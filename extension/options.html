<!-- extension/options.html -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<meta name="color-scheme" content="dark light">
	<title>WebChat Settings</title>
	<link rel="stylesheet" href="options.css"/>
</head>
<body>
<header><h1>WebChat Settings</h1></header>

<main>
	<!-- Chat Mode -->
	<section aria-labelledby="chat-mode">
		<h2 id="chat-mode">Chat Mode</h2>

		<div class="switch-row">
			<span id="ai-mode" class="mode-label">AI Mode</span>

			<!-- Sliding switch: left/right, color constant -->
			<button id="modeSwitch" class="switch" role="switch" aria-checked="false"
					aria-labelledby="ai-mode testing-mode">
				<span class="track" aria-hidden="true"></span>
				<span class="thumb" aria-hidden="true"></span>
			</button>

			<span id="testing-mode" class="mode-label">Testing Mode</span>
		</div>
	</section>

	<!-- Chat Model -->
	<section aria-labelledby="chat-model">
		<h2 id="chat-model">Chat Model</h2>
		<form id="modelForm" role="radiogroup" aria-labelledby="chat-model">
			<div class="model-grid">
				<div class="model-grid-header"></div>
				<div class="model-grid-header">OpenAI</div>
				<div class="model-grid-header">Anthropic</div>

				<div class="model-grid-row-label">Small</div>
				<label class="model"><input type="radio" name="model" value="openai:gpt-5-nano"/><span>gpt-5-nano</span></label>
				<label class="model"><input type="radio" name="model" value="anthropic:claude-haiku-4-5"/><span>claude-haiku-4-5</span></label>

				<div class="model-grid-row-label">Mid</div>
				<label class="model"><input type="radio" name="model" value="openai:gpt-5-mini"/><span>gpt-5-mini</span></label>
				<label class="model"><input type="radio" name="model" value="anthropic:claude-sonnet-4-6"/><span>claude-sonnet-4-6</span></label>

				<div class="model-grid-row-label">Large</div>
				<label class="model"><input type="radio" name="model" value="openai:gpt-5.2" checked/><span>gpt-5.2</span></label>
				<label class="model"><input type="radio" name="model" value="anthropic:claude-opus-4-6"/><span>claude-opus-4-6</span></label>
			</div>
		</form>
	</section>

	<!-- Agent Model -->
	<section aria-labelledby="agent-model">
		<h2 id="agent-model">Agent Model</h2>
		<form id="agentModelForm" role="radiogroup" aria-labelledby="agent-model">
			<div class="model-grid">
				<div class="model-grid-header"></div>
				<div class="model-grid-header">OpenAI</div>
				<div class="model-grid-header">Anthropic</div>

				<div class="model-grid-row-label">Small</div>
				<label class="model"><input type="radio" name="agentModel" value="openai:gpt-5-nano"/><span>gpt-5-nano</span></label>
				<label class="model"><input type="radio" name="agentModel" value="anthropic:claude-haiku-4-5"/><span>claude-haiku-4-5</span></label>

				<div class="model-grid-row-label">Mid</div>
				<label class="model"><input type="radio" name="agentModel" value="openai:gpt-5-mini"/><span>gpt-5-mini</span></label>
				<label class="model"><input type="radio" name="agentModel" value="anthropic:claude-sonnet-4-6"/><span>claude-sonnet-4-6</span></label>

				<div class="model-grid-row-label">Large</div>
				<label class="model"><input type="radio" name="agentModel" value="openai:gpt-5.2" checked/><span>gpt-5.2</span></label>
				<label class="model"><input type="radio" name="agentModel" value="anthropic:claude-opus-4-6"/><span>claude-opus-4-6</span></label>
			</div>
		</form>
	</section>
	<!-- User Profile -->
	<section aria-labelledby="user-profile">
		<h2 id="user-profile">User Profile</h2>
		<p style="margin: 0 0 12px; font-size: 13px; color: #999;">
			Manage your encrypted profile for agent automation. The agent uses this data to fill out forms on your behalf.
		</p>
		<a href="profile.html" target="_blank" style="display: inline-block; padding: 8px 16px; background: #10b981; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 13px;">
			Manage Profile
		</a>
	</section>
</main>

<script type="module" src="options.js"></script>
</body>
</html>
